{% extends "base.html" %}
{% block title %}Admin Login — NJIT Thesis Auditor{% endblock %}
{% block content %}
<main class="card" style="max-width:32rem">
  <h1>Administrator login</h1>
  {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
  {% if login_csrf %}
  <form action="/admin/login" method="post">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <label for="admin-password">Administrator password</label>
    <input id="admin-password" name="password" type="password" autocomplete="current-password" required style="width:100%;padding:.5rem;margin-bottom:.8rem">
    <button type="submit">Log in</button>
  </form>
  {% endif %}
</main>
{% endblock %}
