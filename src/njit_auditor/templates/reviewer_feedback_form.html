<form class="admin-feedback" action="/reviewer/feedback/{{ feedback_entry.id }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ reviewer_csrf_token }}">
  <fieldset><legend>Classification</legend>
    {% for value, label in feedback_classifications.items() %}
    <label><input type="radio" name="classification" value="{{ value }}" {% if feedback_entry.classification == value %}checked{% endif %} required> {{ label }}</label>
    {% endfor %}
  </fieldset>
  <label for="edit-comment-{{ feedback_entry.id }}">Comment (optional)</label>
  <textarea id="edit-comment-{{ feedback_entry.id }}" name="comment" maxlength="4000">{{ feedback_entry.comment }}</textarea>
  <button type="submit" name="action" value="save">Save changes</button>
</form>
<form action="/reviewer/feedback/{{ feedback_entry.id }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ reviewer_csrf_token }}">
  <label><input type="checkbox" name="confirm_delete" value="yes" required> I confirm deletion of this feedback record.</label>
  <button type="submit" name="action" value="delete" class="btn-secondary">Delete feedback</button>
</form>
