name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  PIP_NO_CACHE_DIR: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout without confidential fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/
            !/data/evaluation/
            !/docs/evaluation/ester_feedback/
            !/results/
      - name: Disable subsequent fixture fetching
        run: |
          git config --local lfs.fetchexclude '*'
          git remote remove origin

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify hosted boundary and inventory
        run: |
          python .github/ci/hosted_tests.py check
          python -m unittest discover -s .github/ci -p 'test_*.py'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Synthetic and nonconfidential pytest
        run: python .github/ci/hosted_tests.py test

  minimum-multipart:
    name: Minimum multipart dependencies (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout without confidential fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/
            !/data/evaluation/
            !/docs/evaluation/ester_feedback/
            !/results/
      - name: Disable subsequent fixture fetching
        run: |
          git config --local lfs.fetchexclude '*'
          git remote remove origin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared minimum multipart dependencies
        run: |
          python -m pip install -e ".[dev]" -c .github/ci/minimum-multipart.txt
          python -m pip check
      - name: Verify hosted boundary and inventory
        run: python .github/ci/hosted_tests.py check
      - name: Exercise authenticated feedback with the actual minimum parser
        env:
          NJIT_TEST_MINIMUM_MULTIPART: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider tests/test_http_reviewer_beta.py tests/test_admin_feedback.py

  browser:
    name: Synthetic browser checks (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without confidential fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/raw/
            !/data/evaluation/
            !/docs/evaluation/ester_feedback/
            !/results/
      - name: Disable subsequent fixture fetching
        run: |
          git config --local lfs.fetchexclude '*'
          git remote remove origin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install explicit browser prerequisites
        run: |
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Require working Chromium
        run: |
          python -m playwright --version
          python - <<'PYTHON'
          import psutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runner:
              browser = runner.chromium.launch()
              print("Chromium:", browser.version, "psutil:", psutil.__version__)
              browser.close()
          PYTHON
      - name: Local synthetic navigation, refresh and PDF links
        run: python .github/ci/hosted_tests.py browser
