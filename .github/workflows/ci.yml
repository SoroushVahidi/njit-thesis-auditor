name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # This release task uses synthetic fixtures only. Keep the established
      # full regression job unchanged for all other branches.
      NJIT_DESKTOP_CANDIDATE: ${{ github.head_ref == 'feat/windows-download-gated-20261102' || github.ref_name == 'feat/windows-download-gated-20261102' }}
      GIT_LFS_SKIP_SMUDGE: ${{ (github.head_ref == 'feat/windows-download-gated-20261102' || github.ref_name == 'feat/windows-download-gated-20261102') && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Some tests exercise real Ester sample PDFs/fixtures tracked via Git LFS
          # (data/raw/ester/, tests/fixtures/web_demo/); fetch the real content.
          lfs: ${{ env.NJIT_DESKTOP_CANDIDATE != 'true' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: |
          if [ "$NJIT_DESKTOP_CANDIDATE" = true ]; then
            python -m pytest -q \
              tests/test_windows_download.py tests/test_offline_desktop.py \
              tests/test_windows_startup.py tests/test_desktop_executor.py tests/test_desktop_network.py tests/test_desktop_parity_checkout.py tests/test_desktop_reference.py \
              tests/test_web_app.py tests/test_student_pdf_report.py tests/test_help_rules.py \
              tests/test_mobile_desktop_consistency.py tests/test_pdf_only_website_wording.py
          else
            python -m pytest
          fi
