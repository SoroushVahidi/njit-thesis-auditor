name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # This release task uses synthetic fixtures only. Keep the established
      # full regression job unchanged for all other branches.
      NJIT_DESKTOP_CANDIDATE: ${{ startsWith(github.head_ref, 'release/windows-beta-publish-') || github.head_ref == 'feat/windows-download-gated-20261102' || startsWith(github.ref_name, 'release/windows-beta-publish-') || github.ref_name == 'feat/windows-download-gated-20261102' }}
      GIT_LFS_SKIP_SMUDGE: ${{ (startsWith(github.head_ref, 'release/windows-beta-publish-') || github.head_ref == 'feat/windows-download-gated-20261102' || startsWith(github.ref_name, 'release/windows-beta-publish-') || github.ref_name == 'feat/windows-download-gated-20261102') && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Some tests exercise real Ester sample PDFs/fixtures tracked via Git LFS
          # (data/raw/ester/, tests/fixtures/web_demo/); fetch the real content.
          lfs: ${{ env.NJIT_DESKTOP_CANDIDATE != 'true' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "$NJIT_DESKTOP_CANDIDATE" = true ]; then
            pip install playwright psutil
            python -m playwright install --with-deps chromium
          fi

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: |
          if [ "$NJIT_DESKTOP_CANDIDATE" = true ]; then
            python -m pytest -q \
              tests/test_windows_download.py tests/test_export_newlines.py tests/test_offline_desktop.py \
              tests/test_windows_startup.py tests/test_windows_install_harness.py tests/test_desktop_sessions.py tests/test_desktop_executor.py tests/test_desktop_network.py tests/test_desktop_parity_checkout.py tests/test_desktop_reference.py \
              tests/test_web_app.py tests/test_student_pdf_report.py tests/test_help_rules.py \
              tests/test_mobile_desktop_consistency.py tests/test_pdf_only_website_wording.py
          else
            python -m pytest
          fi

  browser:
    name: Synthetic browser checks (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout without private binary fixtures
        uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install explicit browser prerequisites
        run: |
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Require working Chromium
        run: |
          python -m playwright --version
          python - <<'PYTHON'
          import psutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runner:
              browser = runner.chromium.launch()
              print("Chromium:", browser.version, "psutil:", psutil.__version__)
              browser.close()
          PYTHON
      - name: Local synthetic navigation, refresh and PDF links
        run: |
          python -m pytest -q tests/test_about_browser.py tests/test_ui_help_mobile_overflow.py tests/test_windows_download.py::test_browser_layout_and_keyboard tests/test_browser_audit_workflow.py --junitxml=.runtime/browser-ci.xml
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(".runtime/browser-ci.xml").getroot().iter("testsuite"))
          assert sum(int(s.attrib.get("tests", 0)) for s in suites) > 0
          assert sum(int(s.attrib.get("skipped", 0)) for s in suites) == 0, "Browser CI must not silently skip coverage"
          PYTHON
