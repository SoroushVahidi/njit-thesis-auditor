[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "njit-thesis-auditor"
version = "0.1.0"
description = "Free local-first NJIT thesis and dissertation formatting auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soroush Vahidi" }]
dependencies = [
  "pymupdf>=1.25.0",
  "pdfplumber>=0.11.0; sys_platform == 'win32'",
  "pypdf>=6.21.4; sys_platform != 'win32'",
  "pypdf>=5.0.0; sys_platform == 'win32'",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pylatexenc>=2.10",
  "fastapi>=0.141.1",
  "starlette>=1.6.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.32",
  "jinja2>=3.1.0",
  "python-docx>=1.0.0",
  "reportlab>=4.0.0",
  "pillow>=13.0.0; python_version >= '3.11' and sys_platform != 'win32'",
  "pillow>=12.3.0; python_version < '3.11' and sys_platform != 'win32'",
  "pillow>=12.0.0; sys_platform == 'win32'",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
browser = ["playwright==1.64.1", "psutil==7.2.2"]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.16.4,<0.17.0",
  "mypy>=1.10.0",
  "openpyxl>=3.1.0",
  "httpx>=0.27.0",
]

[project.scripts]
njit-audit = "njit_auditor.cli:app"
njit-admin = "njit_auditor.admin_accounts:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
njit_auditor = [
  "offline_templates/index.html",
  "templates/_macros.html",
  "templates/_windows_download.html",
  "templates/about.html",
  "templates/admin_feedback.html",
  "templates/admin_login.html",
  "templates/base.html",
  "templates/general_feedback.html",
  "templates/help.html",
  "templates/index.html",
  "templates/job.html",
  "templates/problem_group.html",
  "templates/reviewer_login.html",
  "templates/rules.html",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"
packages = ["njit_auditor"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pylatexenc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
